name: fresh-machine
# 新机冒烟（工单26）：fresh clone → 5.1 入口 bootstrap。runner 为管理员上下文——提权路径自动满足
# （不弹 UAC）；WSL 阶段在提权回合真实执行（工单30 全程提权）：runner 无嵌套虚拟化、发行版装不上
# 属预期 BestEffort 降级（黄字手工指引），不打红，判读以日志为准。
# 手动触发随时可用；工单38 起月度定时常态化（公开仓库 runner 免费）+ 幂等重跑腿
# （对齐 LDC fresh-container：第二遍除「身份文件」占位提醒外零 [CHANGED] 才放行）。
on:
  workflow_dispatch:
    inputs:
      full-loop:
        description: '发版全环：含「退了→装」重装腿（例行月度不带——四腿 ~30min vs 全环 ~60min，2026-11-22 主人定夺）'
        type: boolean
        default: false
  schedule:
    - cron: '0 5 1 * *'   # 每月 1 日 05:00 UTC（例行四腿：bootstrap→幂等→快照→clean-legacy→exit）
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      # 已知限制（工单26/27 实录 + 2026-10-21 run 39635213895 复盘）：runner 禁 Delivery Optimization，
      # Chrome 单元曾必败（run3-6）——但该次冒烟 Chrome 实际装成功，DO 可用性随镜像波动，判读以工件为准。
      # 该次唯一 FAIL 是 validate 首调源索引抖动（冷源连败两次），已加「重试+source update 修复」两段式吸收，
      # 复跑 39638286258 全绿收官（史称首绿）。真机无源抖动问题。
      - name: fresh clone + bootstrap（Windows PowerShell 5.1 入口）
        shell: cmd
        run: |
          git clone https://github.com/yu-cn/wdc.git "%RUNNER_TEMP%\wdc"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%RUNNER_TEMP%\wdc\bootstrap.ps1"
      # 幂等重跑腿（工单38）：重跑一遍完整 bootstrap，断言零变更。排除两类已知「非 bootstrap 非幂等」噪声：
      # ① 「身份文件」占位提醒每轮必报 [CHANGED]（runner 无人填身份）——手工待办提醒不是机器变更；
      # ② WT settings 的漂移重渲染——runner 上 Windows Terminal 首启会自改落点（坑6 动态生成器直改落点类，
      #    run 40352220515 实录：两遍间隔 5 分钟即被写穿，重渲染属预期收敛；其余 6 个 dotfiles 幂等跳过实证）。
      # 判定读 bootstrap 自写的 logs/*.log（UTF-8），不读控制台重定向（编码随控制台代码页漂移）。
      - name: 重跑 bootstrap（幂等证明：第二遍应零变更）
        shell: pwsh
        run: |
          $start = Get-Date
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\wdc\bootstrap.ps1" *> "$env:RUNNER_TEMP\rerun-console.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP\rerun-console.log" -Tail 30
            Write-Host '=== logs/*.log 中的 [FAIL] 行（tail 30 之外不丢诊断） ==='
            Get-ChildItem "$env:RUNNER_TEMP\wdc\logs" -Filter '*.log' |
              Where-Object { $_.LastWriteTime -ge $start } |
              ForEach-Object { Select-String -Path $_.FullName -Pattern '^\[FAIL\]' } |
              ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          $logs = @(Get-ChildItem "$env:RUNNER_TEMP\wdc\logs" -Filter '*.log' | Where-Object { $_.LastWriteTime -ge $start })
          $changed = @($logs | ForEach-Object { Select-String -Path $_.FullName -Pattern '^\[CHANGED\]' } | Where-Object {
              $_.Line -notmatch '身份文件' -and $_.Line -notmatch 'settings\.json - (落点与模板不一致|已渲染 <- .*terminal-settings)'
          })
          if ($changed.Count -gt 0) {
            $changed | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "幂等重跑通过：第二遍零变更（核查 $($logs.Count) 份日志，排除项=身份占位提醒 + WT settings 环境写穿）"
      # 09 票 verify 腿（v1.0.0 断言残留绿灯放行的根因放大器补面）：收敛后的机器断言必须全绿。
      # runner 两类已知环境噪声（幂等腿同源实录）：① 身份占位（无人填）——本步预填一次性 CI 身份
      # 消除（.gitidentity 属 exit 红线自留物不随退场走，退了→装重 bootstrap 幂等「已存在」）；
      # ② WT settings 落点写穿（坑6 动态生成器类，run 40352220515 实录）——环境噪声非机器漂移，
      # 滤网放行；其余 FAIL 零容忍。防「断言引用已删文件」类残留再绿灯出厂（bef1b63 实录）。
      - name: wdc verify 机器断言（收敛后应全绿）
        shell: pwsh
        run: |
          $id = Join-Path $env:USERPROFILE '.gitidentity'
          if (-not (Test-Path $id)) {
            "[user]`n    name = wdc-ci`n    email = wdc-ci@users.noreply.github.com`n" | Set-Content -LiteralPath $id -Encoding utf8
          }
          $out = @(& pwsh -NoProfile -File "$env:RUNNER_TEMP\wdc\scripts\verify-machine.ps1" -Quick)
          $code = $LASTEXITCODE
          $out | Write-Host
          $fails = @($out | Where-Object { $_ -match '^\[FAIL\]' -and $_ -notmatch '^\[FAIL\] WT settings' })
          if ($fails.Count -gt 0) { Write-Host '=== verify FAIL（非已知噪声）==='; $fails | ForEach-Object { Write-Host $_ }; exit 1 }
          if ($code -eq 0) { Write-Host 'verify 腿通过：机器断言全绿'; exit 0 }
          if (@($out | Where-Object { $_ -match '^\[FAIL\] 机器断言' }).Count -gt 0) {
            Write-Host 'verify 腿通过：FAIL 仅剩 runner 已知环境噪声（WT settings 写穿——坑6 类，幂等腿同源排除）'; exit 0
          }
          Write-Host "verify 异常中断（无汇总行，退出码 $code）"; exit 1
      # W-B2 快照覆盖腿（v1-program）：fresh 机器首跑 bootstrap 必须已落 pre-install 快照（工单01），
      # manifest status=ok 且 15 keyPath 全在——exit 还原基准的存在性断言
      - name: pre-install 快照断言
        shell: pwsh
        run: |
          $m = Get-Content "$env:LOCALAPPDATA\wdc\pre-install\manifest.json" -Raw | ConvertFrom-Json
          if ($m.status -ne 'ok') { Write-Host "快照 status=$($m.status)"; exit 1 }
          $n = @($m.keys.PSObject.Properties).Count
          if ($n -ne 15) { Write-Host "快照 keyPath 数=$n（预期 15）"; exit 1 }
          Write-Host "快照腿通过：status=ok，$n keyPath 已导出"
      # W-B2 clean-legacy 零发现腿（v1-program 工单02）：全新 runner 上签名清扫必须零发现——
      # 有发现=新机制退役忘登清单（防回归腿）
      - name: clean-legacy 零发现断言
        shell: pwsh
        run: |
          $out = & pwsh -NoProfile -File "$env:RUNNER_TEMP\wdc\scripts\clean-legacy.ps1"
          $out | Write-Host
          # $out 是多行数组：数组 -notmatch 返回「不匹配行数组」非空恒真（run 44917510844 实录）——
          # 先 join 成单串再判，断言的是汇总行「发现 0 项」
          $text = $out -join "`n"
          if ($text -notmatch '发现 0 项') { Write-Host 'clean-legacy 有发现——见上'; exit 1 }
      # W-A exit 腿（v1-program / exit-mechanism 工单03，ADR-0010）：装了→退——完整退出后断言机器状态已清。
      # runner 管理员上下文：无 UAC 重启，-Yes 免确认。声明包/注册表/dotfiles 全退；注册表按 runner
      # 自身的 pre-install 快照逐值还原（工单01 快照在 bootstrap 首跑已落）。除名≠卸载的 Chrome 不在面内。
      - name: wdc exit 完整退出（声明面全退 + 状态断言）
        shell: pwsh
        run: |
          & pwsh -NoProfile -File "$env:RUNNER_TEMP\wdc\scripts\wdc.ps1" exit -Yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\wdc") { Write-Host '状态目录未清'; exit 1 }
          if (Test-Path "$env:USERPROFILE\.wdc") { Write-Host '指针未清'; exit 1 }
          Write-Host 'exit 腿通过：装了→退闭环（声明面全退 + 机器状态已清）'
      # W-D 退了→装 腿（v1-program 回归环的 CI 半场）：exit 后重新 bootstrap 必须全绿——
      # 真正的「装了退、退了装」闭环。本地存量机闭环（LETH）另走主人窗口。
      # 例行月度不带（inputs.full-loop 仅手动 dispatch 有值；schedule 无输入恒 false）——发版前
      # `gh workflow run fresh-machine.yml -f full-loop=true` 跑全环（v1-program 工单04 执行序①）
      - name: 退了→装（exit 后重新 bootstrap）
        if: ${{ inputs.full-loop }}
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "%RUNNER_TEMP%\wdc\bootstrap.ps1"
      # run1 实录：cmd 步骤被 Ctrl+C 掐断仍报 success（假阳性），transcript 随 runner 销毁——
      # 成败都带日志工件回来，判读以日志为准、不看结论位
      - name: 上传 bootstrap 日志（成败都传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: |
            ${{ runner.temp }}\wdc\logs\
            ${{ runner.temp }}\rerun-console.log
