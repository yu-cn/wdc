name: fresh-machine
# 新机冒烟（工单26）：fresh clone → 5.1 入口 bootstrap。runner 为管理员上下文——提权路径自动满足
# （不弹 UAC），WSL 阶段按既有守卫自跳过（提权上下文 + runner 无嵌套虚拟化）。
# 仅手动触发（workflow_dispatch）：spec 曾将「CI 常态化测试」列为 Out-of-Scope，本工作流不定期跑，
# 需要证明「clone 后一条命令开箱即用」时手动来一发。
on: workflow_dispatch
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 预对齐 PS7（工单27 实录）：cli-tools 声明 Microsoft.PowerShell useLatest，runner 预装 pwsh
      # 落后时 bootstrap 应用该单元会触发 MSI 升级、连带杀掉宿主 bootstrap 的 PowerShell 进程树
      # （run1/run2 transcript 实证：[OK] base-windows 后 pipeline stopped）。本步以 cmd 宿主提前
      # 升级，让 bootstrap 看到的 pwsh 已是最新（no-op）。真实机器的同类风险见工单 27。
      - name: 预对齐 PowerShell 7（防 bootstrap 自更新自杀）
        shell: cmd
        run: winget upgrade -e --id Microsoft.PowerShell --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity || exit /b 0
      - name: fresh clone + bootstrap（Windows PowerShell 5.1 入口）
        shell: cmd
        run: |
          git clone https://github.com/yu-cn/WDC.git "%RUNNER_TEMP%\WDC"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%RUNNER_TEMP%\WDC\bootstrap.ps1"
      # run1 实录：cmd 步骤被 Ctrl+C 掐断仍报 success（假阳性），transcript 随 runner 销毁——
      # 成败都带日志工件回来，判读以日志为准、不看结论位
      - name: 上传 bootstrap 日志（成败都传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: ${{ runner.temp }}\WDC\logs\
