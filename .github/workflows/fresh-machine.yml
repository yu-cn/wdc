name: fresh-machine
# 新机冒烟（工单26）：fresh clone → 5.1 入口 bootstrap。runner 为管理员上下文——提权路径自动满足
# （不弹 UAC）；WSL 阶段在提权回合真实执行（工单30 全程提权）：runner 无嵌套虚拟化、发行版装不上
# 属预期 BestEffort 降级（黄字手工指引），不打红，判读以日志为准。
# 仅手动触发（workflow_dispatch）：spec 曾将「CI 常态化测试」列为 Out-of-Scope，本工作流不定期跑，
# 需要证明「clone 后一条命令开箱即用」时手动来一发。
on: workflow_dispatch
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 已知限制（工单26/27 实录 + 2026-10-21 run 39635213895 复盘）：runner 禁 Delivery Optimization，
      # Chrome 单元曾必败（run3-6）——但该次冒烟 Chrome 实际装成功，DO 可用性随镜像波动，判读以工件为准。
      # 该次唯一 FAIL 是 validate 首调源索引抖动（冷源连败两次），已加「重试+source update 修复」两段式吸收，
      # 复跑 39638286258 全绿收官（史称首绿）。真机无源抖动问题。
      - name: fresh clone + bootstrap（Windows PowerShell 5.1 入口）
        shell: cmd
        run: |
          git clone https://github.com/yu-cn/WDC.git "%RUNNER_TEMP%\WDC"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%RUNNER_TEMP%\WDC\bootstrap.ps1"
      # run1 实录：cmd 步骤被 Ctrl+C 掐断仍报 success（假阳性），transcript 随 runner 销毁——
      # 成败都带日志工件回来，判读以日志为准、不看结论位
      - name: 上传 bootstrap 日志（成败都传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: ${{ runner.temp }}\WDC\logs\
