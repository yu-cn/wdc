name: validate
# 源头防线：任何 push/PR 上跑无副作用校验——pre-commit 钩子被绕过（WSL 侧提交/钩子未接线）时兜底，
# 防止坏 commit 进 main（所有机器 pull 即受影响）。只读校验，不改任何状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # 关 winget 源自动更新（2026-11-22 优化批二段）：validate 步 ~30s 里 28s 是 winget 三连，CI 特有的
      # 首调 ~22s 实测归因「runner 镜像源索引陈旧 → 首调自动更新整源」——本地同冷机首调仅 ~6.5s（源新鲜）
      # 佐证；一段的处理器/模块缓存实验已证伪「模块下载说」（runner 上该目录不存在，validate 不下载模块）撤除。
      # 索引坏态兜底不变：validate.ps1 两段式重试里的显式 source update 仍可用。
      - name: 关 winget 源自动更新（防首调 ~22s 源索引刷新）
        shell: pwsh
        run: |
          Set-Content -Encoding utf8 `
            -Path (Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\settings.json') `
            -Value '{"$schema":"https://aka.ms/winget-settings.schema.json","source":{"autoUpdateIntervalMinutes":0}}'
      - name: 诊断 winget 首调成本（临时实验步）
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & winget source list --disable-interactivity 2>&1 | Out-Null
          "source-list 首调: $([math]::Round($sw.Elapsed.TotalSeconds,1))s"
          foreach ($i in 1..2) {
            $sw.Restart()
            & winget configure validate --file configs/base-windows.winget --ignore-warnings --disable-interactivity 2>&1 | Out-Null
            "validate #$i : $([math]::Round($sw.Elapsed.TotalSeconds,1))s rc=$LASTEXITCODE"
          }
          '=== WinGet 目录树（runner 实况） ==='
          Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName.Replace($env:LOCALAPPDATA, '%LOCALAPPDATA%') + $(if ($_.PSIsContainer) { '/' } else { " ($($_.Length) B)" }) }
          '=== winget 日志（首调 28s 去向取证） ==='
          Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -Filter '*.log' |
            Sort-Object LastWriteTime | Select-Object -Last 2 |
            ForEach-Object { "--- $($_.Name) ---"; Get-Content $_.FullName }
          exit 0
      - name: 无副作用校验（winget schema + 脚本静态检查）
        shell: pwsh
        run: ./validate.ps1
