name: validate
# 源头防线：任何 push/PR 上跑无副作用校验——pre-commit 钩子被绕过（WSL 侧提交/钩子未接线）时兜底，
# 防止坏 commit 进 main（所有机器 pull 即受影响）。只读校验，不改任何状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # winget DSC 尝试态缓存（2026-11-22 优化批，三轮诊断定案）：validate 首调 ~22-24s 实测为 winget
      # 尝试自 MSStore 安装 DSC 处理器（ProductId 9NVTPZWRC6KQ；run 44989461063 日志实录 entitlement +
      # store 执行 ~20s 后 8007139F 失败收场，validate 以降级处理器照常通过）——「已尝试」态落
      # WinGet\State 的 config.db，同机二调即 4s。缓存 State 目录令后续 job 免付该税。三轮证伪存档：
      # 源索引自动更新说（source-list 首调仅 0.7s，settings 关自动更新无效已撤）、DSC 模块下载说
      # （两轮 validate 后无 Modules 落盘）、缓存 Configuration 目录（真身在 State 下，首次缓存零命中）。
      # 键 v1 静态：内容为尝试态标记 + 空 history，与配置内容无关；winget 大版本不兼容时删缓存键重置。
      - name: 缓存 winget DSC 尝试态（State 目录）
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Microsoft\WinGet\State
          key: winget-state-v1
      - name: 无副作用校验（winget schema + 脚本静态检查）
        shell: pwsh
        run: ./validate.ps1
