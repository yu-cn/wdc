name: validate
# 源头防线：任何 push/PR 上跑无副作用校验——pre-commit 钩子被绕过（WSL 侧提交/钩子未接线）时兜底，
# 防止坏 commit 进 main（所有机器 pull 即受影响）。只读校验，不改任何状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # 已知地板（2026-11-22 优化批五连实验定案，勿再追）：validate 步 ~30-40s 中首调 ~22-24s 为 winget
      # 冷机上尝试自 MSStore 安装 DSC 处理器（ProductId 9NVTPZWRC6KQ，日志实录 entitlement + store 执行
      # ~20s 后 8007139F 失败收场，validate 以降级处理器照常通过）——处理器装上后此税消失（本机实测
      # 首调 6.5s），但 MSIX 落系统层（WindowsApps），用户目录缓存不可达：缓存 WinGet\State（含
      # config.db）暖跑无效、settings 关源自动更新无效（source-list 首调仅 0.7s）。存档锚点：d570d3a
      # 及其前置 babf008/d3f5773/38a8846/35060f1、run 44989461063。若要根除：GitHub releases 钉版下载
      # dsc + 管理员设置 ConfigurationProcessorPath 指过去（供应链双钉 + 主人定夺）。
      # 钉版 dsc 处理器（首调税根除路落地，2026-11-22 主人定夺）：GitHub releases 钉版下载 dsc
      # （版本 + sha256 双钉，ADR-0011 模式，哈希自官方资产实算），经 validate.ps1 -DscPath 透传
      # --processor-path——winget 源码实证传入即钉自定义处理器路径、短路「找包→MSStore 试装」状态机
      # （ProcessorSettings.EffectiveDscExecutablePath），winget 自行开文件算哈希出审计块。
      # 升级 = $v 与 $pin 同批改（对齐 LDC ADR-0020 钉子哲学：只提醒不自动升）。
      - name: 钉版 dsc 处理器（免 MSStore 试装税）
        shell: pwsh
        run: |
          $v = '3.3.0'
          $pin = '3f8b27f648661903d066cc19d5a6e7a8c13bd07eb738d4d765ce7239619b8b5f'
          $url = "https://github.com/PowerShell/DSC/releases/download/v$v/DSC-$v-x86_64-pc-windows-msvc.zip"
          $zip = "$env:RUNNER_TEMP\dsc.zip"
          $dir = "$env:RUNNER_TEMP\dsc"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $pin) { throw "dsc 资产 sha256 不符（钉 v$v）" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          "DSC_PATH=$dir\dsc.exe" >> $env:GITHUB_ENV
      - name: 无副作用校验（winget schema + 脚本静态检查）
        shell: pwsh
        run: ./validate.ps1 -DscPath $env:DSC_PATH
