name: validate
# 源头防线：任何 push/PR 上跑无副作用校验——pre-commit 钩子被绕过（WSL 侧提交/钩子未接线）时兜底，
# 防止坏 commit 进 main（所有机器 pull 即受影响）。只读校验，不改任何状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # 已知地板（2026-11-22 优化批五连实验定案，勿再追）：validate 步 ~30-40s 中首调 ~22-24s 为 winget
      # 冷机上尝试自 MSStore 安装 DSC 处理器（ProductId 9NVTPZWRC6KQ，日志实录 entitlement + store 执行
      # ~20s 后 8007139F 失败收场，validate 以降级处理器照常通过）——处理器装上后此税消失（本机实测
      # 首调 6.5s），但 MSIX 落系统层（WindowsApps），用户目录缓存不可达：缓存 WinGet\State（含
      # config.db）暖跑无效、settings 关源自动更新无效（source-list 首调仅 0.7s）。存档锚点：d570d3a
      # 及其前置 babf008/d3f5773/38a8846/35060f1、run 44989461063。若要根除：GitHub releases 钉版下载
      # dsc + 管理员设置 ConfigurationProcessorPath 指过去（供应链双钉 + 主人定夺）。
      # 钉版 dsc 根除路已试败撤销（实验⑥，cce325a 实测）：GitHub releases 双钉 dsc + --processor-path
      # 确实短路 store 试装（机制源码实证），但冷机首调反涨至 85s——30MB 未签名处理器/适配器解压 +
      # 首用初始化比 store 试装税贵四倍，整跑 111s 全场最差。经验阶梯终局：基线 ~50s < settings 关源
      # 更新 57s < State 目录缓存 54s < 钉版 dsc 111s——基线即地板。
      - name: 无副作用校验（winget schema + 脚本静态检查）
        shell: pwsh
        run: ./validate.ps1
