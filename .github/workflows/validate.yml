name: validate
# 源头防线：任何 push/PR 上跑无副作用校验——pre-commit 钩子被绕过（WSL 侧提交/钩子未接线）时兜底，
# 防止坏 commit 进 main（所有机器 pull 即受影响）。只读校验，不改任何状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # winget configure 处理器/模块缓存（2026-11-22 优化批）：validate 步 ~30s 里 28s 是 winget 三连，
      # 其中首调冷启动 ~22s 为一次性下载 dscv3 processor + DSC 资源模块（落 %LOCALAPPDATA% 下
      # WinGet\Configuration）——runner 用后即焚，每 push 重付。缓存键 = 配置内容 hash（配置变→重拉），
      # restore-keys 前缀垫底旧缓存、winget 自行补差；命中后冷启动塌缩至暖态秒级。
      - name: 缓存 winget configure 处理器与模块
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Microsoft\WinGet\Configuration
          key: winget-config-${{ hashFiles('configs/*.winget') }}
          restore-keys: winget-config-
      - name: 无副作用校验（winget schema + 脚本静态检查）
        shell: pwsh
        run: ./validate.ps1
